    <title>과제전</title>
    <link rel="stylesheet" href="style.css">

    <div id="background-canvas"></div>

    <div class="stage">

    <!-- Vertical divider -->
    <div class="divider-v"></div>

    <!-- Header: logo + brand (top-left) -->
    <div class="logo-mark"></div>
    <div class="brand">
        <span class="glitch-text">UOSVD</span> <span class="glitch-text">VISUAL</span><br>
        <span class="glitch-text">DESIGN</span> <span class="glitch-text">1&amp;2</span>
    </div>

    <!-- Top Menu (right panel) -->
    <nav class="top-menu">
        <div class="school-logo"></div>
        <div class="menu-item m-showall card-1" data-svg="showall"><span class="hl">Show All</span></div>
        <div class="menu-item m-generative card-6-group" data-svg="generative"><span class="hl">Generative<br>System</span></div>
        <div class="menu-item m-shape card-5" data-svg="shape"><span class="hl">Shape Poster</span></div>
        <div class="menu-item m-self card-8-group" data-svg="self"><span class="hl">Self-<br>Identity</span></div>
        <div class="menu-item m-collected card-3-group" data-svg="collected"><span class="hl">Collected<br>book</span></div>
        <div class="menu-item m-map card-2-group" data-svg="map"><span class="hl">Mapping<br>Your Time</span></div>
    </nav>

    <!-- Student work preview (left panel, shown on character hover) -->
    <img class="student-preview" id="student-preview" alt="">
